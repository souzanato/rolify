name: mongoid

on: [push, pull_request]

# Mongoid support is best effort: it is exercised against the current release
# so that regressions are visible, but ActiveRecord is the supported default
# and the compatibility matrix only covers it.
jobs:
  test:
    name: ruby 3.4 / mongoid_9
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/mongoid_9.gemfile
      ADAPTER: mongoid
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run specs
        run: bundle exec rake
